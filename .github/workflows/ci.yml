name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy agent_vault

      - name: Run pytest (with coverage gate)
        run: pytest -v --cov=agent_vault --cov-report=term-missing --cov-fail-under=65

      - name: Dependency audit (advisory)
        # Informational only: pip-audit scans the whole environment (including
        # base build tooling like setuptools/wheel) which the project can't pin,
        # so a fresh advisory there must not block the pipeline. It still surfaces
        # runtime-dep issues in the log for triage.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Run ESLint
        run: |
          cd web
          npm run lint

      - name: Run tests
        run: |
          cd web
          npm test -- --run

      - name: Build
        run: |
          cd web
          npm run build

      - name: Audit production dependencies
        # Blocking: scoped to shipped (non-dev) deps, so build-tooling advisories
        # in vite/vitest don't gate — only vulnerabilities in code that ships.
        run: |
          cd web
          npm audit --omit=dev --audit-level=high

  mcp-extra:
    # Exercises the optional [mcp] install path so the FastMCP wiring can't
    # silently rot (the mypy blind spot that had this pipeline red lived here).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install with the mcp extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,mcp]

      - name: Typecheck with mcp installed
        run: mypy agent_vault

      - name: MCP import + tool tests
        run: pytest -v tests/test_mcp_server_import.py tests/test_mcp_tools.py
