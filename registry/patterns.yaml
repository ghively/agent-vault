# ============================================================================
# registry/patterns.yaml  —  CLASSIFIER VOCABULARY for ingestion (Stage 2)
# ============================================================================
# Half the system's intelligence lives here. Grows over time:
#   - HUMAN can edit directly (add a new biller you see in real life).
#   - PROMOTION step (Stage 4) will also append graduated discoveries here.
#   - The LLM never writes this file (same anti-rot rule as schema/aliases).
#
# Two sections:
#   billers  -> known external entities (banks, utilities, retailers). Each maps
#               surface-form matches in extracted text to a stable identity
#               PLUS optional cross-links into the existing entity graph.
#   shapes   -> structural patterns ("this looks like a statement / warranty /
#               order confirmation / insurance declaration"). Type-level shapes,
#               vendor-agnostic.
#
# Confidence on each entry: how sure we are when this pattern fires alone.
# The classifier composes signals — biller + shape produce a stronger result
# than either alone (capped at 0.97 to leave headroom for human review).
# ============================================================================
version: 1

