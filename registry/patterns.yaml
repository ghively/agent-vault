# Structural shapes — what the document IS, regardless of vendor.
# Each shape lists keyword phrases. min_matches = how many must appear.
shapes:
  - id: statement
    type: document
    subtype: statement
    keywords:
      - "statement period"
      - "previous balance"
      - "current balance"
      - "ending balance"
      - "beginning balance"
      - "statement balance"
      - "remaining balance"
      - "principal paid"
      - "interest paid"
    min_matches: 2
    confidence: 0.85

  - id: bill
    type: document
    subtype: statement
    keywords:
      - "total due"
      - "amount due"
      - "due date"
      - "billing period"
      - "monthly charge"
      - "minimum payment due"
      - "next payment due"
    min_matches: 2
    confidence: 0.85

  - id: warranty
    type: document
    subtype: warranty
    keywords:
      - "limited warranty"
      - "warranted against"
      - "warranty period"
      - "warranty expires"
      - "covered for"
    min_matches: 1
    confidence: 0.85

  - id: manual
    type: document
    subtype: manual
    keywords:
      - "owner's manual"
      - "installation guide"
      - "user manual"
      - "instruction manual"
    min_matches: 1
    confidence: 0.85

  - id: insurance-declaration
    type: document
    subtype: contract
    keywords:
      - "policy number"
      - "policy period"
      - "named insured"
      - "premium"
      - "renewal date"
    min_matches: 2
    confidence: 0.85

  - id: property-tax
    type: document
    subtype: tax
    keywords:
      - "property tax"
      - "parcel id"
      - "assessed value"
      - "tax year"
      - "trustee"
    min_matches: 2
    confidence: 0.88

  - id: order-confirmation
    type: event
    subtype: purchase
    keywords:
      - "order #"
      - "order confirmation"
      - "order total"
      - "estimated delivery"
      - "thank you for your order"
      - "your order has been"
    min_matches: 1
    confidence: 0.82

  - id: shipment-notice
    type: event
    subtype: purchase
    keywords:
      - "has shipped"
      - "shipping notification"
      - "tracking"
      - "shipped via"
    min_matches: 1
    confidence: 0.75

  - id: receipt
    type: document
    subtype: receipt
    keywords:
      - "receipt from"
      - "receipt #"
      - "order id"
      - "billed to"
    min_matches: 1
    confidence: 0.80

  - id: renewal-notice
    type: event
    subtype: appointment
    keywords:
      - "renews on"
      - "renewal date"
      - "renews soon"
      - "membership renews"
    min_matches: 1
    confidence: 0.78

  - id: balance-alert
    type: event
    subtype: incident
    keywords:
      - "balance alert"
      - "balance below"
      - "low balance"
    min_matches: 1
    confidence: 0.80

  - id: inspection-report
    type: document
    subtype: contract
    keywords:
      - "inspection report"
      - "inspection date"
      - "inspector"
    min_matches: 2
    confidence: 0.82

