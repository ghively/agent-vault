  # ---- Image-only shapes (applies_to filters by detected file kind) ----
  # Without `applies_to`, "serial" appears in warranty PDFs too — we only want
  # photo-scan classification when the file actually IS an image.
  - id: device-label
    type: document
    subtype: photo-scan
    applies_to: [jpeg, png]
    keywords:
      - "serial plate"
      - "serial number"
      - "data plate"
      - "model number"
      - "model:"
      - "serial:"
    min_matches: 1
    confidence: 0.78

  - id: receipt-scan
    type: document
    subtype: photo-scan
    applies_to: [jpeg, png]
    keywords:
      - "receipt"
      - "total"
      - "subtotal"
      - "purchase"
    min_matches: 1
    confidence: 0.68

  - id: screenshot
    type: media
    subtype: screenshot
    applies_to: [png, jpeg]
    keywords:
      - "screenshot"
      - "screen capture"
    min_matches: 1
    confidence: 0.75

# File-type priors — applied when no shape matches but the file type is
# informative on its own. Lower confidence than a shape match.
file_type_priors:
  jpeg: { type: media, subtype: family-photo, confidence: 0.55 }
  png:  { type: media, subtype: screenshot,   confidence: 0.55 }
  email_personal: { type: event, subtype: incident, confidence: 0.40 }
