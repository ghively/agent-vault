[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-vault"
version = "0.2.0"
description = "Deterministic, file-based document wiki — retrieval, ingest, compile, promote. No model, no hallucination surface."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agent Vault" }]
# Runtime deps: the vault is nearly pure stdlib. PyYAML is required for YAML parsing.
# Phase 2 adds FastAPI service deps.
dependencies = ["pyyaml>=6.0", "fastapi>=0.115", "uvicorn[standard]>=0.32", "sse-starlette>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx2>=2.0", "types-PyYAML>=6.0"]
# Optional: expose the vault to agents over the Model Context Protocol.
# `pip install "agent-vault[mcp]"` then run `agent-vault-mcp`.
mcp = ["mcp>=1.2"]

[project.scripts]
agent-vault = "agent_vault.synapse:main"
agent-vault-serve = "agent_vault.serve:main"
agent-vault-mcp = "agent_vault.mcp_server:main"
agent-vault-backup = "agent_vault.backup:main"
agent-vault-migrate = "agent_vault.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_vault"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Legacy scripts use compact one-liners; allow E701 (colon) and E702 (semicolon) there.
[tool.ruff.lint.per-file-ignores]
"agent_vault/build_index.py" = ["E701", "E702"]
"agent_vault/collections_importer.py" = ["E701", "E702"]
"agent_vault/compact.py" = ["E701", "E702"]
"agent_vault/compiler.py" = ["E701", "E702"]
"agent_vault/ingest.py" = ["E701", "E702"]
"agent_vault/lint.py" = ["E701", "E702"]
"agent_vault/promote.py" = ["E701", "E702"]
"agent_vault/reclassify_apply.py" = ["E701", "E702"]
"agent_vault/review.py" = ["E701", "E702"]
"agent_vault/synapse.py" = ["E701", "E702"]
"agent_vault/validate.py" = ["E701", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
# Legacy scripts may need per-module easing (see Task 5); add overrides there.

# NEW code under agent_vault/api/ MUST be mypy-strict — this is the default.
# Only legacy scripts get eased below.

# Legacy scripts predate strict typing; ease them while keeping NEW code strict.
# These are the original Agent Vault scripts written before mypy adoption.
[[tool.mypy.overrides]]
module = [
  "agent_vault.build_index",
  "agent_vault.collections_importer",
  "agent_vault.compact",
  "agent_vault.compiler",
  "agent_vault.ingest",
  "agent_vault.lint",
  "agent_vault.locking",
  "agent_vault.promote",
  "agent_vault.reclassify_apply",
  "agent_vault.review",
  "agent_vault.secret_scan",
  "agent_vault.synapse",
  "agent_vault.validate",
  "agent_vault.resolvers",
  "agent_vault.resolvers.*",
  # Thin FastMCP wiring around the strict, tested mcp_tools.py. Eased because
  # the optional `mcp` SDK ships no type info, so its decorators are untyped.
  "agent_vault.mcp_server",
]
strict = false
disable_error_code = [
  "no-untyped-def",
  "attr-defined",
  "no-untyped-call",
  # FastMCP's @server.tool() decorators are untyped (the optional `mcp` SDK
  # ships no type info), so decorating makes the tool fns "untyped" — expected
  # for this eased wiring module, and the reason CI's `mypy agent_vault` was red.
  "untyped-decorator",
  "import-untyped",
  "import-not-found",
  "var-annotated",
  "union-attr",
  "arg-type",
  "assignment",
  "misc",
  "operator",
  "no-redef",
  "unused-ignore",
  "type-var",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test watchdog (needs pytest-timeout): tests/api/test_jobs.py spawns real
# subprocesses and has hung in constrained sandboxes — fail fast with a
# traceback instead of eating the CI job's whole wall-clock budget.
timeout = 120

# Coverage is opt-in (CI passes --cov flags) so local `pytest` stays fast;
# this just scopes measurement to the package when it is enabled.
[tool.coverage.run]
source = ["agent_vault"]
omit = ["agent_vault/mcp_server.py"]  # thin optional FastMCP wiring; covered by the mcp-extra job's import smoke
